<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I knew it :3</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #171717;
            color: white;
            text-align: center;
        }

        header {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 30px;
            margin: 8px 0 22px;
        }

        .video-container {
            width: min(100%, 400px);
            aspect-ratio: 9 / 16;
            max-height: 70vh;
            border-radius: 16px;
            overflow: hidden;
            background: #242424;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            margin-top: 18px;
            color: #aaaaaa;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header>:3</header>

    <h1>I knew it,</h1>

    <div class="video-container">
        <iframe src="https://www.tiktok.com/player/v1/7586208726072315166?music_info=1&amp;description=0" title="TikTok video" allow="autoplay; fullscreen" allowfullscreen="">
        </iframe>
    </div>

    <footer>:3</footer>


</body></html>
